<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Digital Library</h1>
        <div class="stats-bar">
            <div class="stat-item">Total Books: <span id="total-books">0</span></div>
            <div class="stat-item">Read Percentage: <span id="read-percentage">0%</span></div>
        </div>
    </header>

    <main>
        <div id="library-grid" class="grid"></div>
    </main>

    <section class="form-container">
        <form id="add-book-form">
            <h3>Add New Book</h3>
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="number" id="pages" placeholder="Total Pages" required>
            
            <div class="borrow-group">
                <label><input type="checkbox" id="is-borrowed"> Is Borrowed?</label>
                <input type="text" id="borrower-name" placeholder="Who borrowed it?">
            </div>

            <label><input type="checkbox" id="read-status"> Mark as Read</label>
            <button type="submit" id="submit-btn">Add to Library</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
